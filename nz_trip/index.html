<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Zealand South Island Road Trip - Bilingual</title>
    <!-- Load D3.js, TopoJSON, and Tailwind CSS -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/5;
            background-color: #d1eaef; /* Ocean color */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid #cbd5e1;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        svg:active {
            cursor: grabbing;
        }

        .land {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 0.5px;
        }

        .route {
            fill: none;
            stroke: #ea580c; /* Orange-600 */
            stroke-width: 4px;
            stroke-dasharray: 8 8;
            animation: dash 40s linear infinite;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .point {
            fill: #dc2626; /* Red-600 */
            stroke: #ffffff;
            stroke-width: 2px;
        }

        .city-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            fill: #1e293b;
            pointer-events: none;
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.95);
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .city-label tspan.zh {
            font-weight: 600;
            fill: #475569; /* Slightly lighter for Chinese subtitle */
        }

        .route-label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            fill: #0f172a;
            pointer-events: none;
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 3.5px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .control-btn {
            background-color: white;
            border: 1px solid #cbd5e1;
            color: #334155;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            user-select: none;
        }

        .control-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        @keyframes dash {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }

        @media (max-width: 600px) {
            #map-wrapper {
                aspect-ratio: 3/4;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }
            .controls {
                bottom: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div class="text-center w-full max-w-4xl mb-6 mt-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">South Island Road Trip</h1>
        <p class="text-sm sm:text-base text-slate-500">Christchurch ➔ Lake Tekapo ➔ Wanaka ➔ Queenstown ➔ Dunedin ➔ Christchurch</p>
    </div>

    <div id="map-wrapper">
        <div class="controls">
            <button id="zoom-in" class="control-btn" title="Zoom In">+</button>
            <button id="zoom-out" class="control-btn" title="Zoom Out">−</button>
            <button id="zoom-reset" class="control-btn" title="Reset View" style="font-size: 14px;">↺</button>
        </div>
        <svg id="map"></svg>
    </div>

    <script>
        const width = 800;
        const height = 1000;

        const svg = d3.select("#map")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        const g = svg.append("g");

        // Define a Mercator projection centered on the South Island
        const projection = d3.geoMercator()
            .center([170.5, -44.3])
            .scale(5500)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // Data definition for cities (Bilingual)
        const cities = [
            { en: "Christchurch", zh: "基督城", coords: [172.6362, -43.5320], offset: [15, -10], anchor: "start" },
            { en: "Lake Tekapo", zh: "蒂卡波湖", coords: [170.4794, -44.0047], offset: [-15, -15], anchor: "end" },
            { en: "Wanaka", zh: "瓦纳卡", coords: [169.1321, -44.7032], offset: [-15, -15], anchor: "end" },
            { en: "Queenstown", zh: "皇后镇", coords: [168.6626, -45.0311], offset: [-15, 10], anchor: "end" },
            { en: "Dunedin", zh: "但尼丁", coords: [170.5028, -45.8788], offset: [15, 10], anchor: "start" }
        ];

        // Define segments with intermediate coordinates and Chinese labels
        const routeSegments = [
            {
                coords: [ [172.6362, -43.5320], [171.2, -43.8], [170.4794, -44.0047] ],
                label: "226公里 • 2小时50分",
                labelPos: [171.2, -43.8] // Midpoint
            },
            {
                coords: [ [170.4794, -44.0047], [169.8, -44.4], [169.1321, -44.7032] ],
                label: "200公里 • 2小时15分",
                labelPos: [169.8, -44.4]
            },
            {
                coords: [ [169.1321, -44.7032], [168.9, -44.9], [168.6626, -45.0311] ],
                label: "68公里 • 1小时",
                labelPos: [168.9, -44.9]
            },
            {
                coords: [ [168.6626, -45.0311], [169.5, -45.5], [170.5028, -45.8788] ],
                label: "282公里 • 3小时30分",
                labelPos: [169.5, -45.5]
            },
            {
                coords: [ [170.5028, -45.8788], [171.1, -44.5], [172.6362, -43.5320] ],
                label: "360公里 • 4小时30分",
                labelPos: [171.1, -44.5]
            }
        ];

        // Use Catmull-Rom spline to interpolate curves organically through points
        const lineGenerator = d3.line()
            .x(d => projection(d)[0])
            .y(d => projection(d)[1])
            .curve(d3.curveCatmullRom.alpha(0.5));

        const zoom = d3.zoom()
            .scaleExtent([1, 8]) // Allow zooming 1x to 8x
            .translateExtent([[0, 0], [width, height]])
            .on("zoom", (event) => {
                const k = event.transform.k;
                g.attr("transform", event.transform);
                
                // Semantic zooming: scale elements inversely to keep them visually identical
                g.selectAll(".point")
                    .attr("r", 6 / k)
                    .attr("stroke-width", 2 / k);
                
                g.selectAll(".route")
                    .style("stroke-width", (4 / k) + "px");
                
                // Adjust city group positioning and scaling dynamically
                g.selectAll(".city-label")
                    .style("stroke-width", (4 / k) + "px")
                    .attr("y", d => projection(d.coords)[1] + (d.offset[1] / k));
                
                // Keep the individual tspan x-coordinates aligned with their parents using /k
                g.selectAll(".city-label tspan")
                    .attr("x", function() {
                        const parentData = d3.select(this.parentNode).datum();
                        return projection(parentData.coords)[0] + (parentData.offset[0] / k);
                    })
                    .style("font-size", function() {
                        // Make English slightly larger than Chinese
                        const isZh = d3.select(this).classed("zh");
                        return isZh ? (12 / k) + "px" : (14 / k) + "px";
                    });
                    
                g.selectAll(".route-label")
                    .style("font-size", (12 / k) + "px")
                    .style("stroke-width", (3.5 / k) + "px");
            });

        svg.call(zoom);

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(world => {
            const countries = topojson.feature(world, world.objects.countries).features;
            
            // Draw landmasses
            g.selectAll(".land")
                .data(countries)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path);

            // Draw curved route segments
            g.selectAll(".route")
                .data(routeSegments)
                .enter().append("path")
                .attr("class", "route")
                .attr("d", d => lineGenerator(d.coords));

            // Draw route labels (Distance and Time in Chinese)
            g.selectAll(".route-label")
                .data(routeSegments)
                .enter().append("text")
                .attr("class", "route-label")
                .attr("x", d => projection(d.labelPos)[0])
                .attr("y", d => projection(d.labelPos)[1])
                .attr("text-anchor", "middle")
                .text(d => d.label)
                // Initialize default styles so it inherits correctly on zoom
                .style("font-size", "12px")
                .style("stroke-width", "3.5px");

            // Draw city marker dots
            g.selectAll(".point")
                .data(cities)
                .enter().append("circle")
                .attr("class", "point")
                .attr("cx", d => projection(d.coords)[0])
                .attr("cy", d => projection(d.coords)[1])
                .attr("r", 6);

            // Draw bilingual city names using <tspan> for multiline support
            const cityLabels = g.selectAll(".city-label")
                .data(cities)
                .enter().append("text")
                .attr("class", "city-label")
                .attr("text-anchor", d => d.anchor)
                .attr("y", d => projection(d.coords)[1] + d.offset[1])
                .style("stroke-width", "4px");
            
            // English Line
            cityLabels.append("tspan")
                .attr("class", "en")
                .attr("x", d => projection(d.coords)[0] + d.offset[0])
                .attr("dy", "0")
                .text(d => d.en)
                .style("font-size", "14px");

            // Chinese Line
            cityLabels.append("tspan")
                .attr("class", "zh")
                .attr("x", d => projection(d.coords)[0] + d.offset[0])
                .attr("dy", "1.2em") // Pushes the Chinese text down automatically based on font-size
                .text(d => d.zh)
                .style("font-size", "12px");

        }).catch(err => console.error("Error loading map data:", err));

        d3.select("#zoom-in").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 1.5);
        });

        d3.select("#zoom-out").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 0.667);
        });

        d3.select("#zoom-reset").on("click", () => {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        });

    </script>
</body>
</html>
