<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新西兰南岛 9 日自驾之旅</title>
    <!-- Load D3.js, TopoJSON, and Tailwind CSS -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 4/5;
            background-color: #d1eaef; /* Ocean color */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid #cbd5e1;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        svg:active {
            cursor: grabbing;
        }

        .land {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 0.5px;
        }

        .route {
            fill: none;
            stroke: #ea580c; /* Orange-600 */
            stroke-width: 4px;
            stroke-dasharray: 8 8;
            animation: dash 40s linear infinite;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .point {
            fill: #dc2626; /* Red-600 */
            stroke: #ffffff;
            stroke-width: 2px;
        }

        .city-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            fill: #1e293b;
            pointer-events: none;
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.95);
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .city-label tspan.zh {
            font-weight: 600;
            fill: #475569; /* Slightly lighter for Chinese subtitle */
        }

        .route-label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            fill: #0f172a;
            pointer-events: none;
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 3.5px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }

        .control-btn {
            background-color: white;
            border: 1px solid #cbd5e1;
            color: #334155;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            user-select: none;
        }

        .control-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        @keyframes dash {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }

        @media (max-width: 600px) {
            body {
                padding-bottom: 3% !important;
            }
            #map-wrapper {
                flex-grow: 1;
                aspect-ratio: auto;
                border-radius: 0;
                border-left: none;
                border-right: none;
                border-bottom: none;
                margin-bottom: 0;
            }
            .controls {
                bottom: 10px;
                right: 10px;
            }
        }

        /* Place information popup */
        #place-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(15, 23, 42, 0.48);
            z-index: 100;
        }
        #place-modal.open { display: flex; }
        .place-card {
            width: min(680px, 100%);
            max-height: min(82vh, 760px);
            overflow-y: auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            padding: 24px;
            position: relative;
            color: #334155;
        }
        .place-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 44px;
            height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            background: white;
            color: #334155;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }
        .place-card h2 {
            margin: 0 48px 6px 0;
            font-size: 28px;
            line-height: 1.25;
            color: #0f172a;
        }
        .place-card .place-en {
            margin: 0 0 18px;
            color: #64748b;
            font-size: 16px;
        }
        .place-card h3 {
            margin: 20px 0 8px;
            font-size: 19px;
            color: #0f172a;
        }
        .place-card p, .place-card li {
            font-size: 17px;
            line-height: 1.7;
        }
        .place-card ul {
            margin: 8px 0 0;
            padding-left: 22px;
        }
        .place-hint {
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f1f5f9;
            font-size: 15px;
            line-height: 1.5;
        }
        .point, .city-label { cursor: pointer; }
        @media (max-width: 600px) {
            .place-card {
                padding: 20px;
                border-radius: 16px;
                max-height: 88vh;
            }
            .place-card h2 { font-size: 25px; }
            .place-card p, .place-card li { font-size: 17px; }
            .city-label .en { font-size: 17px !important; }
            .city-label .zh { font-size: 16px !important; }
        }
    </style>
</head>
<body class="p-3 sm:p-8">

    <div class="text-center w-full max-w-4xl mb-6 mt-4">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-2">新西兰南岛自驾之旅</h1>
        <p class="text-base sm:text-lg text-slate-600 leading-relaxed">基督城 ➔ 蒂卡波湖 ➔ 库克山 ➔ 瓦纳卡 ➔ 皇后镇 ➔ 但尼丁 ➔ 奥马鲁 ➔ 基督城</p>
    </div>

    <div id="map-wrapper">
        <div class="controls">
            <button id="zoom-in" class="control-btn" title="Zoom In">+</button>
            <button id="zoom-out" class="control-btn" title="Zoom Out">−</button>
            <button id="zoom-reset" class="control-btn" title="Reset View" style="font-size: 18px;">↺</button>
        </div>
        <svg id="map"></svg>
    </div>

    <div id="place-modal" role="dialog" aria-modal="true" aria-labelledby="place-title">
        <div class="place-card">
            <button class="place-close" id="place-close" aria-label="关闭">×</button>
            <h2 id="place-title"></h2>
            <p id="place-en" class="place-en"></p>
            <div id="place-content"></div>
        </div>
    </div>

    <script>
        const mapWrapper = document.getElementById("map-wrapper");
        const width = 800;
        // Dynamically calculate the SVG coordinate height to match the wrapper's actual aspect ratio
        const height = width * (mapWrapper.clientHeight / mapWrapper.clientWidth) || 1000;

        const svg = d3.select("#map")
            .attr("viewBox", `0 0 ${width} ${height}`)
            .attr("preserveAspectRatio", "xMidYMid meet");

        const g = svg.append("g");

        // Define a Mercator projection centered on the South Island
        const projection = d3.geoMercator()
            .center([170.5, -44.3])
            .scale(5500)
            .translate([width / 2, height / 2]);

        const path = d3.geoPath().projection(projection);

        // Data definition for cities (Bilingual)
        const cities = [
            {
                en: "Christchurch", zh: "基督城", coords: [172.6362, -43.5320],
                offset: [15, -10], anchor: "start",
                title: "基督城", intro: "南岛自驾的起点与终点，适合用较轻松的节奏开始旅程。",
                sections: [
                    ["值得看看", ["基督城植物园", "坎特伯雷博物馆（开放时）", "基督城美术馆", "市中心与雅芳河"]],
                    ["适合你的玩法", ["第一天不要安排太满，把它作为调整节奏、补给和熟悉右侧驾驶的时间。"]]
                ]
            },
            {
                en: "Lake Tekapo", zh: "蒂卡波湖", coords: [170.4794, -44.0047],
                offset: [-15, -15], anchor: "end",
                title: "蒂卡波湖", intro: "蓝绿色湖水、牧场与南阿尔卑斯山构成的经典南岛景观，也是观星的好地方。",
                sections: [
                    ["值得看看", ["好牧羊人教堂", "蒂卡波湖湖畔", "麦肯齐盆地景观"]],
                    ["推荐活动", ["农场体验：适合喜欢农场与乡村景观的你。", "夜间观星：这里属于奥拉基·麦肯齐国际暗夜天空保护区。"]],
                    ["建议停留", ["住 1 晚；如果特别重视观星，也可以住 2 晚。"]]
                ]
            },
            {
                en: "Aoraki / Mt Cook", zh: "奥拉基／库克山", coords: [170.0950, -43.7360],
                offset: [15, -12], anchor: "start",
                title: "奥拉基／库克山国家公园", intro: "从蒂卡波出发约 1 小时多，是整段行程中最值得专门留宿的高山冰川景观区域之一。",
                sections: [
                    ["值得看看", ["普卡基湖及湖畔观景点", "库克山村", "塔斯曼冰川与蓝湖一带"]],
                    ["短途活动", ["Kea Point Track：适合希望控制运动量、又想近距离感受高山景观的行程。", "也可以只做较短的冰川观景步道和观景点停留。"]],
                    ["建议停留", ["住 1 晚，争取日落和第二天清晨的山景。"]]
                ]
            },
            {
                en: "Wanaka", zh: "瓦纳卡", coords: [169.1321, -44.7032],
                offset: [-15, -15], anchor: "end",
                title: "瓦纳卡", intro: "比皇后镇更悠闲的湖畔小镇，湖泊、山景、农场和自然体验结合得很好。",
                sections: [
                    ["值得看看", ["瓦纳卡湖", "孤独树（That Wānaka Tree）", "湖畔步道"]],
                    ["推荐活动", ["瓦纳卡薰衣草农场：农场、花园与乡村景观。", "Mou Waho Island：乘船前往无捕食者保护区，进行轻松自然步行；岛上还有一座湖，形成“湖中岛、岛中湖”的独特景观。"]],
                    ["建议停留", ["住 1 晚；如果希望减少赶路，可以住 2 晚。"]]
                ]
            },
            {
                en: "Queenstown", zh: "皇后镇", coords: [168.6626, -45.0311],
                offset: [-15, 10], anchor: "end",
                title: "皇后镇", intro: "山、湖和度假小镇结合的南岛核心目的地，不需要参加极限运动也值得停留。",
                sections: [
                    ["值得看看", ["瓦卡蒂普湖", "皇后镇花园", "湖畔与市中心", "附近的 Arrowtown 箭镇"]],
                    ["推荐活动", ["TSS Earnslaw 蒸汽船＋Walter Peak 高地农场：蒸汽船、湖景、牧场和动物一次结合。", "Skyline 缆车：不用徒步登山也能获得俯瞰皇后镇和湖泊的视野。"]],
                    ["建议停留", ["住 2 晚。第二天安排成轻松的湖泊＋农场日，不必追求刺激项目。"]]
                ]
            },
            {
                en: "Dunedin", zh: "但尼丁", coords: [170.5028, -45.8788],
                offset: [15, 10], anchor: "start",
                title: "但尼丁", intro: "历史建筑、大学城气质与奥塔哥半岛野生动物结合的城市，非常适合你的兴趣。",
                sections: [
                    ["值得看看", ["但尼丁市区历史建筑", "奥塔哥半岛", "拉纳克城堡"]],
                    ["动物与自然", ["Royal Albatross Centre：皇家信天翁繁殖地。", "奥塔哥半岛还可以看到海豹、海狮和企鹅，并欣赏壮阔海岸线。"]],
                    ["建议停留", ["住 1 晚；如果想慢慢探索半岛，可以把第二天上午也留给这里。"]]
                ]
            },
            {
                en: "Oamaru", zh: "奥马鲁", coords: [170.9680, -45.0970],
                offset: [15, -12], anchor: "start",
                title: "奥马鲁", intro: "它不只是但尼丁到基督城之间的中途住宿点：维多利亚时代建筑和小蓝企鹅让这里很值得住一晚。",
                sections: [
                    ["值得看看", ["维多利亚历史街区", "Steampunk HQ 蒸汽朋克主题景点", "奥马鲁港"]],
                    ["动物亮点", ["小蓝企鹅：傍晚返回海岸，是这里最值得安排时间的体验之一。"]],
                    ["建议停留", ["住 1 晚。建议下午抵达，逛历史街区，傍晚看企鹅归巢。"]]
                ]
            }
        ];

        // Define segments with intermediate coordinates and Chinese labels
        const routeSegments = [
            { coords: [[172.6362,-43.5320],[171.2,-43.8],[170.4794,-44.0047]], label: "约 3 小时", labelPos: [171.2,-43.8] },
            { coords: [[170.4794,-44.0047],[170.0950,-43.7360]], label: "约 1 小时 15 分", labelPos: [170.28,-43.86] },
            { coords: [[170.0950,-43.7360],[169.6,-44.3],[169.1321,-44.7032]], label: "约 2.5 小时", labelPos: [169.55,-44.3] },
            { coords: [[169.1321,-44.7032],[168.9,-44.9],[168.6626,-45.0311]], label: "约 1–1.5 小时", labelPos: [168.9,-44.9] },
            { coords: [[168.6626,-45.0311],[169.5,-45.5],[170.5028,-45.8788]], label: "约 3.5 小时", labelPos: [169.55,-45.45] },
            { coords: [[170.5028,-45.8788],[170.75,-45.45],[170.9680,-45.0970]], label: "约 1.5 小时", labelPos: [170.75,-45.45] },
            { coords: [[170.9680,-45.0970],[171.7,-44.2],[172.6362,-43.5320]], label: "约 3 小时 20 分", labelPos: [171.7,-44.2] }
        ];

        // Use Catmull-Rom spline to interpolate curves organically through points
        const lineGenerator = d3.line()
            .x(d => projection(d)[0])
            .y(d => projection(d)[1])
            .curve(d3.curveCatmullRom.alpha(0.5));

        const zoom = d3.zoom()
            .scaleExtent([1, 8]) // Allow zooming 1x to 8x
            .translateExtent([[0, 0], [width, height]])
            .on("zoom", (event) => {
                const k = event.transform.k;
                g.attr("transform", event.transform);
                
                // Semantic zooming: scale elements inversely to keep them visually identical
                g.selectAll(".point")
                    .attr("r", 6 / k)
                    .attr("stroke-width", 2 / k);
                
                g.selectAll(".route")
                    .style("stroke-width", (4 / k) + "px");
                
                // Adjust city group positioning and scaling dynamically
                g.selectAll(".city-label")
                    .style("stroke-width", (4 / k) + "px")
                    .attr("y", d => projection(d.coords)[1] + (d.offset[1] / k));
                
                // Keep the individual tspan x-coordinates aligned with their parents using /k
                g.selectAll(".city-label tspan")
                    .attr("x", function() {
                        const parentData = d3.select(this.parentNode).datum();
                        return projection(parentData.coords)[0] + (parentData.offset[0] / k);
                    })
                    .style("font-size", function() {
                        // Make English slightly larger than Chinese
                        const isZh = d3.select(this).classed("zh");
                        return isZh ? (16 / k) + "px" : (18 / k) + "px";
                    });
                    
                g.selectAll(".route-label")
                    .style("font-size", (16 / k) + "px")
                    .style("stroke-width", (3.5 / k) + "px");
            });

        svg.call(zoom);

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(world => {
            const countries = topojson.feature(world, world.objects.countries).features;
            
            // Draw landmasses
            g.selectAll(".land")
                .data(countries)
                .enter().append("path")
                .attr("class", "land")
                .attr("d", path);

            // Draw curved route segments
            g.selectAll(".route")
                .data(routeSegments)
                .enter().append("path")
                .attr("class", "route")
                .attr("d", d => lineGenerator(d.coords));

            // Draw route labels (Distance and Time in Chinese)
            g.selectAll(".route-label")
                .data(routeSegments)
                .enter().append("text")
                .attr("class", "route-label")
                .attr("x", d => projection(d.labelPos)[0])
                .attr("y", d => projection(d.labelPos)[1])
                .attr("text-anchor", "middle")
                .text(d => d.label)
                // Initialize default styles so it inherits correctly on zoom
                .style("font-size", "16px")
                .style("stroke-width", "3.5px");

            // Draw city marker dots
            g.selectAll(".point")
                .data(cities)
                .enter().append("circle")
                .attr("class", "point")
                .attr("cx", d => projection(d.coords)[0])
                .attr("cy", d => projection(d.coords)[1])
                .attr("r", 6);

            // Draw bilingual city names using <tspan> for multiline support
            const cityLabels = g.selectAll(".city-label")
                .data(cities)
                .enter().append("text")
                .attr("class", "city-label")
                .attr("text-anchor", d => d.anchor)
                .attr("y", d => projection(d.coords)[1] + d.offset[1])
                .style("stroke-width", "4px");
            
            // English Line
            cityLabels.append("tspan")
                .attr("class", "en")
                .attr("x", d => projection(d.coords)[0] + d.offset[0])
                .attr("dy", "0")
                .text(d => d.en)
                .style("font-size", "18px");

            // Chinese Line
            cityLabels.append("tspan")
                .attr("class", "zh")
                .attr("x", d => projection(d.coords)[0] + d.offset[0])
                .attr("dy", "1.2em") // Pushes the Chinese text down automatically based on font-size
                .text(d => d.zh)
                .style("font-size", "16px");

            // Make every place marker and label touch/click friendly.
            g.selectAll(".point")
                .on("click", (event, d) => { event.stopPropagation(); showPlace(d); })
                .on("touchstart", (event, d) => { event.stopPropagation(); showPlace(d); });

            cityLabels
                .on("click", (event, d) => { event.stopPropagation(); showPlace(d); })
                .on("touchstart", (event, d) => { event.stopPropagation(); showPlace(d); });

        }).catch(err => console.error("Error loading map data:", err));


        // Interactive place information
        const modal = document.getElementById("place-modal");
        const closeBtn = document.getElementById("place-close");
        const titleEl = document.getElementById("place-title");
        const enEl = document.getElementById("place-en");
        const contentEl = document.getElementById("place-content");

        function showPlace(d) {
            titleEl.textContent = d.title;
            enEl.textContent = d.en;
            contentEl.innerHTML = d.sections.map(([heading, items]) =>
                `<h3>${heading}</h3><ul>${items.map(item => `<li>${item}</li>`).join("")}</ul>`
            ).join("") + `<div class="place-hint">点击右上角 × 关闭介绍；在手机上也可以点击地图上的地点名称或红色标记重新打开。</div>`;
            modal.classList.add("open");
        }

        function hidePlace() {
            modal.classList.remove("open");
        }

        closeBtn.addEventListener("click", hidePlace);
        modal.addEventListener("click", (e) => {
            if (e.target === modal) hidePlace();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") hidePlace();
        });

        d3.select("#zoom-in").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 1.5);
        });

        d3.select("#zoom-out").on("click", () => {
            svg.transition().duration(300).call(zoom.scaleBy, 0.667);
        });

        d3.select("#zoom-reset").on("click", () => {
            svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
        });

    </script>
</body>
</html>
